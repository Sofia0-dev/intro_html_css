<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    table {
        width: 100%;
        border: 1px solid #110202;
        /* border-collapse: collapse; */
        margin-bottom: 20px;


    }
    th {
        border: 1px solid #110202;
        background-color: #f2f2f2;
        text-align: center;
        padding: 8px;
    } 
td {
        border: 1px solid #110202;
        padding: 8px;
    }

/* CSS Frameworks... Bootstrap */
</style>






</head>


<body>
