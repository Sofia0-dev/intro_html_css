<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Linear+B&display=swap');
  
* {
    margin: 0;
    padding: 0;

}

        body {
            font-family: 'Noto Sans Linear B', sans-serif;

        }

        nav {
            display: flex;
            justify-content: center;
            /* background:rgb(112, 96, 4); */
            border-bottom: 1px solid rgb(112, 96, 4);
        }

        .nav-items {
            width: 80%;
            /* background:  beige; */
            display : flex;
            justify-content: space-between;
            align-items: center;
            /* border-bottom: 1px solid rgb(112, 96, 4); */
        }

         .nav-items ul {
            display: flex;
            list-style: none;
            justify-content: space-between;
            width: 50%;
         }
            

         .nav-items  li {
            margin-right: 20px;
            margin-left: 20px;
            
         }

         .nav-items a {
            text-decoration: none;
            color: pink;
            font-weight: bold; 
         }
       
         .nav-items a:hover {
            color: rgb(5, 91, 132);
            transition: 0.3s;
            text-decoration: underline;
         }
         
         /* git add . */
         /* git commit -m "Built the nav bar" */
         /* git push */

    </style>

</head>

    <!-- semantic tags -->

    <nav>
